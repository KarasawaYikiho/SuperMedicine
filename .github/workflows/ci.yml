name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate documentation and metadata
        shell: pwsh
        run: |
          python scripts/maintainers/check_docs.py
          python scripts/maintainers/sync_release_metadata.py --check
          $pytestTemp = Join-Path $env:RUNNER_TEMP "pytest-docs"
          python -m pytest tests/test_docs_contract.py tests/test_repository_policy.py -q --tb=short --override-ini addopts= -p no:cacheprovider --basetemp $pytestTemp

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check --select=E,F,W --ignore=E501 .
      - name: mypy
        run: python -m mypy core permission cli plugins agents adapters installer

  python-versions:
    name: Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    uses: ./.github/workflows/_reusable-python.yml
    with:
      os: ubuntu-latest
      python-version: ${{ matrix.python-version }}
      test-target: tests

  platform-smoke:
    name: Platform ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    uses: ./.github/workflows/_reusable-python.yml
    with:
      os: ${{ matrix.os }}
      python-version: "3.12"
      test-target: tests

  wheel-smoke:
    name: Wheel Clean Install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build
      - name: Build and smoke Wheel
        shell: pwsh
        run: |
          python -m build --wheel --outdir wheelhouse
          $wheel = (Get-ChildItem -LiteralPath wheelhouse -Filter *.whl | Select-Object -First 1).FullName
          python -m pip install $wheel --target wheel-smoke
          python scripts/ci/smoke_wheel_install.py wheel-smoke

  required-gate:
    name: CI / Required Gate
    if: always()
    needs: [docs, static-analysis, python-versions, platform-smoke, wheel-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          failed = {name: value["result"] for name, value in results.items() if value["result"] != "success"}
          if failed:
              print(f"Required jobs failed: {failed}")
              sys.exit(1)
          PY
