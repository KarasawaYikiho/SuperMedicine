name: Reusable Python Test

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-version:
        required: true
        type: string
      test-target:
        required: false
        type: string
        default: tests

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run tests
        shell: pwsh
        run: |
          $pytestTemp = Join-Path $env:RUNNER_TEMP "pytest-${{ inputs.python-version }}"
          python -m pytest ${{ inputs.test-target }} -q --tb=short --override-ini addopts= -p no:cacheprovider --basetemp $pytestTemp
